name: FastAPI Pull Request Pipeline

on:
   pull_request:
      branches:
         - master
         - staging
         - prod
   workflow_dispatch:

jobs:
   gitleak-scan:
      name: Run Git-Scan
      runs-on: ubuntu-latest
      steps:
         - name: Checkot Code
           uses: actions/checkout@v3

         - name: Set up Python
           uses: actions/setup-python@v4
           with:
              python-version: 3.11 

         - name: Setup Gitscan
           uses: gitleaks/gitleaks-action@v2

         - name: Run Gitleaks Scan
           run: |
               gitleaks detect --source ./backend --exit-code 1

   test:
      name: Run CI Tests
      runs-on: ubuntu-latest
      steps:
         - name: Checkout code
           uses: actions/checkout@v3 

         - name: Set up Python
           uses: actions/setup-python@v4
           with:
              python-version: 3.11

         - name: Install UV
           run: |
              python -m pip install --upgrade pip
              pip install uv

         - name: Run UV
           run: uv install

         - name: Run tests
           run: uv run pytest
   
   trivy-scan:
      name: Run Trivy Scan
      runs-on: ubuntu-latest
      needs: test
      steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
            scan-type: 'fs'
            scan-ref: '.'
            format: 'table'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'