name: FastAPI CI-Build

on:
  push:
    branches:
      - staging
      - prod

jobs:
  gitleak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - uses: gitleaks/gitleaks-action@v2
      - run: gitleaks detect --source ./backend --exit-code 1

  test:
    runs-on: ubuntu-latest
    needs: gitleak-scan
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install uv
      - run: uv install
      - run: uv run pytest

  trivy-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  manual-approval:
    runs-on: ubuntu-latest
    needs: trivy-scan
    environment:
      name: ci-approval
    steps:
      - run: echo "Waiting for manual approval"

  build:
    runs-on: ubuntu-latest
    needs: manual-approval
    steps:
      - uses: actions/checkout@v3

      - name: Read version
        id: read_version
        run: |
          VERSION=$(cat VERSION.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ vars.DOCKER_USERNAME }}/fastapi-template:${{ env.VERSION }} .
          docker push ${{ vars.DOCKER_USERNAME }}/fastapi-template:${{ env.VERSION }}

      - name: Increment version and commit
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$(cat VERSION.txt)"
          PATCH=$((PATCH+1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo $NEW_VERSION > VERSION.txt
          git config user.name "github-actions"
          git config user.email "prosperibe12@gmail.com"
          git add VERSION.txt
          git commit -m "Increment version to $NEW_VERSION [skip ci]"
          git push
